<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BioGloss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header: Aliniat la stânga și adaptat pentru safe area de sus -->
    <header>
        <div class="header-content">
            <img src="Logo.png" alt="BioGloss Logo">
        </div>
    </header>

    <!-- Sub Header: Prezentare -->
    <div class="presentation-container">
        <img src="Prezentare.png" alt="Prezentare Produse BioGloss">
    </div>

    <!-- 10 Produse NP-uri -->
    <section class="products-container">
        <h2 class="section-title"></h2>
        <div class="products-grid" id="juiceGrid">
            <!-- Produsele vor fi injectate din script.js -->
        </div>
    </section>

    <!-- Sub NP-uri: Slideuri unul lângă altul -->
    <div class="slides-container">
        <div class="slide-box">
            <img src="Slideunu.png" alt="Slide Unu">
        </div>
        <div class="slide-box">
            <img src="Slidedoi.png" alt="Slide Doi">
        </div>
    </div>

    <!-- Footer: Logo în stânga, text centrat pe mijloc -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo-zone">
                <img src="Logodoi.png" alt="BioGloss Logo Footer">
            </div>
            <div class="footer-text-zone">
                <p>&copy; 2026 BioGloss - Oje de Unghii. Toate drepturile rezervate.</p>
                <p>Frumusețe care începe cu grijă.</p>
            </div>
        </div>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
