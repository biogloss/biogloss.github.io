<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <!-- Permite site-ului să folosească ecranul complet -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <!-- Elimină zona gri de sus și o face Albă (la fel ca header-ul) -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <!-- Elimină zona gri de jos și o face Roz (la fel ca footer-ul) -->
    <meta name="theme-color" content="#FCE6E6" media="(prefers-color-scheme: dark)">
    <!-- Notă: Pentru a forța ambele nuanțe simultan pe iOS, combinăm nuanța principală -->
    <meta name="theme-color" content="#ffffff">

    <title>BioGloss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header fix: Rămâne sus la scroll -->
    <header>
        <div class="header-content">
            <img src="Logo.png" alt="BioGloss Logo">
        </div>
    </header>

    <!-- Zona de mijloc (body-ul) -->
    <div class="main-content">
        <!-- Prezentare -->
        <div class="presentation-container">
            <img src="Prezentare.png" alt="Prezentare Produse BioGloss">
        </div>

        <!-- 10 Produse NP-uri -->
        <section class="products-container">
            <h2 class="section-title">Nuanțe NP</h2>
            <div class="products-grid" id="juiceGrid">
                <!-- Produsele sunt injectate din script.js -->
            </div>
        </section>

        <!-- Slide-uri unul lângă altul -->
        <div class="slides-container">
            <div class="slide-box">
                <img src="Slideunu.png" alt="Slide Unu">
            </div>
            <div class="slide-box">
                <img src="Slidedoi.png" alt="Slide Doi">
            </div>
        </div>
    </div>

    <!-- Footer fix: Îmbracă capacul de jos -->
    <footer>
        <div class="footer-content">
            <div class="footer-logo-side">
                <img src="Logodoi.png" alt="BioGloss Logo Footer">
            </div>
            <div class="footer-text-side">
                <p>&copy; 2026 BioGloss. Toate drepturile rezervate.</p>
            </div>
        </div>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
